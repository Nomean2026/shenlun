<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>规范表达闯关 100 题</title><style>
:root{--paper:#faf8f3;--ink:#1f1c18;--muted:#6b6459;--line:#e2dccf;--accent:#a4161a;--accent2:#1f4d3f;--card:#fff;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Songti SC","STSong","SimSun",serif;font-weight:600;letter-spacing:.5px}
a{color:var(--accent2)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 80px}
header.top{padding:48px 0 24px;border-bottom:1px solid var(--line);margin-bottom:22px}
header.top h1{margin:0 0 10px;font-size:32px}
header.top p{margin:0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.stat b{display:block;font-size:24px;color:var(--accent);font-family:"Songti SC",serif}
.stat span{font-size:12px;color:var(--muted)}
.toolbar{position:sticky;top:0;z-index:20;background:rgba(250,248,243,.94);backdrop-filter:blur(6px);padding:14px 0;border-bottom:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid rgba(164,22,26,.18);border-color:var(--accent)}
.btn{font:inherit;cursor:pointer;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--ink);color:#faf8f3;border-color:var(--ink)}
progress{width:100%;height:4px;border:0;background:#eae4d7}
progress::-webkit-progress-bar{background:#eae4d7}
progress::-webkit-progress-value{background:var(--accent)}
progress::-moz-progress-bar{background:var(--accent)}
.cat-head{margin:38px 0 12px}
.cat-head h2{font-size:22px;margin:0 0 6px}
.cat-head p{margin:0;color:var(--muted);font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.idx{font-family:"Songti SC",serif;color:var(--accent);font-weight:600}
.sent{margin:8px 0 10px;font-size:16px;font-family:"Songti SC","STSong",serif;line-height:1.9}
.ansRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.label{font-size:11px;letter-spacing:2px;color:var(--muted);border-left:3px solid var(--accent);padding-left:8px}
.ans{font-weight:700;font-size:17px;color:var(--accent2)}
.masked .ans{filter:blur(6px);cursor:pointer;user-select:none}
.masked .ans:hover{filter:blur(3px)}
.tip{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.master{margin-top:10px}
.done{opacity:.62}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:40px}
.overlay{position:fixed;inset:0;background:rgba(31,28,24,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 6px;font-size:18px;color:var(--accent)}
@media(max-width:640px){header.top h1{font-size:24px}.sent{font-size:15px}.wrap{padding:0 14px 60px}}

.qcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px 32px;box-shadow:0 8px 30px rgba(0,0,0,.05);margin-top:22px}
.qtop{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);letter-spacing:1px}
.qsent{font-family:"Songti SC","STSong",serif;font-size:23px;line-height:2;margin:22px 0 6px}
.qhint{font-size:13px;color:var(--muted)}
.answerRow{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.answerRow input{flex:1;min-width:200px;font-size:17px;padding:12px 14px}
.fb{margin-top:20px;padding:16px 18px;border-radius:12px;display:none}
.fb.ok{display:block;background:#eef6f1;border:1px solid #c8e0d2}
.fb.no{display:block;background:#fdf0ef;border:1px solid #f0cfcc}
.fb.tip{display:block;background:#fff9e8;border:1px solid #f0e2b6}
.fb b{font-size:18px;color:var(--accent2)}
.fb .term{font-size:22px;font-weight:700;color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{font:inherit;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{background:#eef6f1;border-color:#8bbfa5}
.opt.wrong{background:#fdf0ef;border-color:#d9a09b}
.opt .k{color:var(--muted);font-size:12px;margin-right:8px}
.mini{font-size:12.5px;color:var(--muted);margin-top:8px}
.result h2{font-size:26px;margin:0 0 6px}
.big{font-size:44px;color:var(--accent);font-family:"Songti SC",serif;line-height:1.2}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
.box b{display:block;font-size:26px;color:var(--accent2)}
.box span{font-size:12.5px;color:var(--muted)}
.wrongItem{border-bottom:1px dashed var(--line);padding:12px 0}
.wrongItem:last-child{border:0}
.wrongItem p{margin:0 0 4px}
.small{font-size:13px;color:var(--muted)}
@media(max-width:640px){.qsent{font-size:19px}.opts{grid-template-columns:1fr}.qcard{padding:22px 18px}.grid3{grid-template-columns:1fr 1fr 1fr}}
</style></head>
<body>
<div class="wrap">
<header class="top">
  <h1>规范表达闯关 · 100 题</h1>
  <p>看材料句，写出规范表达。先输入判定，答错自动弹出四个选项；解析在最后，先别急着看。</p>
</header>

<section id="home">
  <div class="qcard">
    <h3 style="margin-top:0">选择练习范围</h3>
    <div class="chips" id="catChips"></div>
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="start">开始闯关</button>
      <button class="btn" id="reviewWrong">只练错题本（<span id="wrongCount">0</span>）</button>
    </div>
    <p class="mini" id="history"></p>
    <p class="mini">判分规则：与标准表达或同义写法完全一致才算对；差一个字、换一种说法都会弹出四个选项，正好借机辨析。输入框留空点“提交”不会跳过。</p>
  </div>
</section>

<section id="quiz" style="display:none">
  <div class="row" style="justify-content:space-between;margin-top:6px">
    <span class="small" id="qpos"></span>
    <span class="small" id="qscore"></span>
  </div>
  <progress id="bar" value="0" max="100" style="margin-top:8px"></progress>
  <div class="qcard">
    <div class="qtop"><span id="qcat"></span><span id="qidx"></span></div>
    <p class="qsent" id="qsent"></p>
    <p class="qhint" id="qhint">写出这一句对应的规范表达（2—8 个字）</p>
    <div class="answerRow">
      <input type="text" id="ans" placeholder="在这里输入规范表达，回车提交" autocomplete="off">
      <button class="btn primary" id="submit">提交</button>
      <button class="btn" id="hint">给点提示</button>
      <button class="btn" id="skip">跳过</button>
    </div>
    <div class="fb" id="fb"></div>
    <div class="row" style="margin-top:16px;display:none" id="nextRow">
      <button class="btn primary" id="next">下一题 →</button>
      <span class="small" id="savedTip"></span>
    </div>
  </div>
</section>

<section id="result" style="display:none">
  <div class="qcard result">
    <h2>本轮结束</h2>
    <p class="small">一次答对率 <span class="big" id="rate">0%</span></p>
    <div class="grid3">
      <div class="box"><b id="rFirst">0</b><span>一次答对</span></div>
      <div class="box"><b id="rHint">0</b><span>提示后答对</span></div>
      <div class="box"><b id="rWrong">0</b><span>未掌握</span></div>
    </div>
    <h3>错题回顾</h3>
    <div id="wrongList"></div>
    <div class="row" style="margin-top:20px">
      <button class="btn primary" id="againWrong">立即重练错题</button>
      <button class="btn" id="againAll">再刷一轮</button>
      <button class="btn" id="home2">返回首页</button>
    </div>
  </div>
</section>
</div>
<script>
const DATA = {"cats":[{"id":"gov","name":"政务服务与政府治理","intro":"概括政府“怎么做事”的词，常见于概括做法题、对策题。答题时优先用“动词+宾语”的四字结构。","usage":"高频句式：完善……机制、压实……责任、推动……下沉、实现……一体化、从“管理”转向“服务”。"},{"id":"city","name":"城市治理与公共服务","intro":"城市治理类材料专供，考查精细化、智慧化、人性化三条主线，以及“重地上轻地下”等典型问题。","usage":"问题侧：设施不完善、重面子轻里子；对策侧：分区分级、智慧监管、补齐短板、因地制宜。"},{"id":"ind","name":"产业转型与企业经营","intro":"常考“变与不变”“传统与现代”“规模与品质”的辩证关系，是2026副省级作文的原生语境。","usage":"分析句式：以……为主、……为辅；在……之间找准平衡点；既……又……，防止非此即彼。"},{"id":"rur","name":"乡村振兴与基层发展","intro":"空心化、撂荒、等靠要、头雁效应是四大高频词，作答多用“人、地、钱、业”四维展开。","usage":"对策句式：盘活……资源、推动……下沉、培育……带头人、拓宽……渠道。"},{"id":"liv","name":"民生保障（养老·医疗·教育）","intro":"“一老一小”是近年重点，养老看普惠可及与安全监管的平衡，教育看均衡与资源共享。","usage":"对策句式：发展普惠型……、推进医养结合、促进优质资源下沉、避免“一刀切”。"},{"id":"cul","name":"文化传承与文化产业","intro":"核心是“传承—转化—传播”三步：先护住根脉，再创造性转化，最后提升影响力。","usage":"对策句式：坚持修旧如旧、推动创造性转化创新性发展、打造文化新地标、讲好中国故事。"},{"id":"eco","name":"生态文明与绿色发展","intro":"“两山”理念贯穿，问题侧抓“重经济轻环境”，对策侧抓绿色低碳、循环经济、生态补偿。","usage":"对策句式：推动绿色化生产、建立生态补偿机制、发展循环经济、倡导绿色低碳生活方式。"},{"id":"sci","name":"科技创新与人才","intro":"高频矛盾是“引进与自主”“引才与用才”，要写出从“输血”到“造血”的转变。","usage":"对策句式：提升自主创新能力、破解“卡脖子”、柔性引才、以老带新、促进成果转化。"},{"id":"law","name":"法治建设与执法监管","intro":"执法类材料必背“严格规范公正文明执法”一整句，以及柔性执法、联合执法、精准监管。","usage":"对策句式：坚持严格规范公正文明执法、压实平台主体责任、提高违法成本、推进联合执法。"},{"id":"sty","name":"干部作风与基层减负","intro":"“不作为、慢作为、乱作为、不善为”是四胞胎，必须按材料的具体表现精确区分。","usage":"对策句式：整治形式主义、为基层减负、健全容错纠错机制、坚持严管和厚爱相结合。"},{"id":"soc","name":"社会心态与文明素养","intro":"多用于分析原因，抓心理动因：从众、逆反、面子、攀比、陌生人社会。","usage":"分析句式：折射出……心理；根源在于……；需加强引导，培育理性平和的社会心态。"},{"id":"econ","name":"经济消费与市场秩序","intro":"市场类材料抓“竞争秩序、供需结构、消费升级”三条线，注意区分现象与本质。","usage":"对策句式：维护公平竞争、优化营商环境、释放消费潜力、推动供需高水平动态平衡。"}],"items":[{"id":"gov-1","c":"gov","s":"市民在手机上就能办完社保、公积金等全部审批事项。","t":"掌上办／指尖办","a":["掌上办","指尖办"],"tip":"载体是手机、App，关键词“不用跑”","w":["一站式办理","延时服务","代办服务"]},{"id":"gov-2","c":"gov","s":"过去办营业执照要跑五个部门、交三套材料，现在一个窗口一次办结。","t":"一站式服务／只跑一趟","a":["一站式服务","一站式办理","只跑一趟"],"tip":"一个窗口、一次办结","w":["限时办结","首问负责","告知承诺制"]},{"id":"gov-3","c":"gov","s":"群众登录政务平台提交材料，全程网上审批，不用再到大厅。","t":"一网通办／全程网办 const WKEY = "shenlun_quiz_wrong_v1", HKEY = "shenlun_quiz_history_v1";
let wrongBook = JSON.parse(localStorage.getItem(WKEY) || "{}");
let history = JSON.parse(localStorage.getItem(HKEY) || "[]");
const $ = id => document.getElementById(id);
const catName = id => (DATA.cats.find(c=>c.id===id)||{}).name || id;

let queue = [], idx = 0, first = 0, hinted = 0, wrong = 0, stage = "ask", hintUsed = false, cur = null;
let missed = new Set();

// 首页
$("catChips").innerHTML = [{id:"all",name:"全部"}].concat(DATA.cats.map(c=>({id:c.id,name:c.name})))
  .map(c=>`<button class="chip ${c.id==='all'?'on':''}" data-cat="${c.id}">${c.name}</button>`).join("");
$("catChips").addEventListener("click", e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  document.querySelectorAll("#catChips .chip").forEach(x=>x.classList.toggle("on",x===b));
});
function selectedCat(){ const b=document.querySelector("#catChips .chip.on"); return b?b.dataset.cat:"all"; }
function refreshHome(){
  $("wrongCount").textContent = Object.keys(wrongBook).length;
  if(history.length){
    const h = history[history.length-1];
    $("history").textContent = `上次：${h.date}，${h.total} 题，一次答对 ${h.first} 题（${Math.round(h.first/h.total*100)}%）。历史共 ${history.length} 轮。`;
  } else $("history").textContent = "";
}
refreshHome();

function buildQueue(cat, onlyWrong){
  let list = DATA.items.slice();
  if(onlyWrong) list = list.filter(x=>wrongBook[x.id]);
  else if(cat!=="all") list = list.filter(x=>x.c===cat);
  shuffle(list);
  return list;
}
function startRound(list){
  queue = list; idx=0; first=0; hinted=0; wrong=0; missed = new Set();
  $("home").style.display="none"; $("result").style.display="none"; $("quiz").style.display="block";
  renderQ();
}
$("start").onclick = ()=> startRound(buildQueue(selectedCat(), false));
$("reviewWrong").onclick = ()=>{
  const list = buildQueue("all", true);
  if(!list.length){ alert("错题本是空的，先刷一轮吧。"); return; }
  startRound(list);
};

function renderQ(){
  cur = queue[idx]; stage="ask"; hintUsed=false;
  $("fb").className="fb"; $("fb").innerHTML="";
  $("nextRow").style.display="none"; $("savedTip").textContent="";
  $("qpos").textContent = `第 ${idx+1} / ${queue.length} 题`;
  $("qscore").textContent = `一次答对 ${first} · 提示后 ${hinted} · 未掌握 ${wrong}`;
  $("qcat").textContent = catName(cur.c);
  $("qidx").textContent = cur.id.split("-")[1] ? "#" + cur.id.split("-")[1] : "";
  $("qsent").textContent = cur.s;
  $("qhint").textContent = "写出这一句对应的规范表达（2—8 个字）";
  const inp = $("ans"); inp.value=""; inp.disabled=false; inp.focus();
  $("bar").value = Math.round(idx/queue.length*100);
  $("submit").disabled=false; $("hint").disabled=false; $("skip").disabled=false;
}

function norm(s){ return (s||"").replace(/[\s\p{P}\p{S}]/gu, "").replace(/[A-Za-z0-9]/g, m=>m).toLowerCase(); }
function variants(q){
  const arr = [q.t].concat(q.a||[]);
  const out = new Set();
  arr.forEach(v=>{
    v.split(/[／/、，,（）()]/).forEach(p=>{ const n=norm(p); if(n) out.add(n); });
    const n=norm(v); if(n) out.add(n);
  });
  return [...out];
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i), cur=[];
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function isRight(input, q){
  const u = norm(input); if(!u) return false;
  for(const v of variants(q)){ if(u===v) return true; }
  return false;
}

$("submit").onclick = submitAnswer;
$("ans").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); if(stage==="ask") submitAnswer(); else $("next").click(); } });

function submitAnswer(){
  if(stage!=="ask") return;
  const val = $("ans").value.trim();
  if(!val){ $("ans").focus(); $("qhint").textContent="先写一个答案再提交；实在不会，点“给点提示”或“跳过”。"; return; }
  if(isRight(val, cur)){
    stage="done"; missed.delete(cur.id);
    $("ans").disabled=true; $("submit").disabled=true; $("hint").disabled=true; $("skip").disabled=true;
    if(hintUsed){ hinted++; } else { first++; }
    $("fb").className="fb ok";
    $("fb").innerHTML = `<div>✓ 答对了</div><p style="margin:6px 0 0">规范表达：<b>${cur.t}</b></p><p class="mini">${cur.tip}</p>`;
    finishQ();
  } else {
    stage="option";
    $("ans").disabled=true; $("submit").disabled=true; $("hint").disabled=true;
    $("fb").className="fb no";
    $("fb").innerHTML = `<div>✗ 差一点，不是这个说法</div><p class="mini" style="margin:4px 0 0">从下面四个选项里选出规范表达：</p><div class="opts" id="opts"></div>`;
    const opts = [cur.t.split(/[／/]/)[0]].concat(cur.w).map(s=>s.trim());
    shuffle(opts);
    $("opts").innerHTML = opts.map((o,i)=>`<button class="opt" data-o="${o}"><span class="k">${"ABCD"[i]}</span>${o}</button>`).join("");
    $("opts").addEventListener("click", ev=>{
      const b = ev.target.closest(".opt"); if(!b) return;
      const good = isRight(b.dataset.o, cur);
      document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      b.classList.add(good?"right":"wrong");
      if(good){
        hinted++; missed.delete(cur.id);
        $("fb").className="fb ok";
        $("fb").innerHTML = `<div>✓ 选对了（提示后掌握）</div><p style="margin:6px 0 0">规范表达：<b>${cur.t}</b></p><p class="mini">${cur.tip}</p>`;
      } else {
        document.querySelectorAll(".opt").forEach(x=>{ if(isRight(x.dataset.o,cur)) x.classList.add("right"); });
        $("fb").className="fb no";
        $("fb").innerHTML = `<div>还是不对，正确答案是</div><p class="term" style="margin:6px 0 0">${cur.t}</p><p class="mini">${cur.tip}</p>`;
        wrong++; missed.add(cur.id); addWrong(cur.id);
      }
      stage="done";
      finishQ();
    });
  }
}
$("hint").onclick = ()=>{
  if(stage!=="ask") return;
  hintUsed = true;
  $("fb").className="fb tip";
  $("fb").innerHTML = `<div>提示</div><p class="mini" style="margin:6px 0 0">${cur.tip}｜答案共 ${[...cur.t.replace(/[／/、，（）()]/g,"")].length} 个字（含分隔符则按常见搭配写）</p>`;
};
$("skip").onclick = ()=>{
  if(stage==="done") return;
  wrong++; missed.add(cur.id); addWrong(cur.id); stage="done";
  $("ans").disabled=true; $("submit").disabled=true; $("hint").disabled=true; $("skip").disabled=true;
  $("fb").className="fb no";
  $("fb").innerHTML = `<div>本题跳过，正确答案是</div><p class="term" style="margin:6px 0 0">${cur.t}</p><p class="mini">${cur.tip}</p>`;
  finishQ();
};
function finishQ(){
  $("nextRow").style.display="flex";
  $("qscore").textContent = `一次答对 ${first} · 提示后 ${hinted} · 未掌握 ${wrong}`;
  $("next").textContent = (idx===queue.length-1) ? "查看本轮结果 →" : "下一题 →";
  $("bar").value = Math.round((idx+1)/queue.length*100);
}
$("next").onclick = ()=>{
  if(idx < queue.length-1){ idx++; renderQ(); }
  else showResult();
};
function addWrong(id){
  wrongBook[id] = (wrongBook[id]||0) + 1;
  localStorage.setItem(WKEY, JSON.stringify(wrongBook));
  $("savedTip").textContent = "已加入错题本";
}
function showResult(){
  $("quiz").style.display="none"; $("result").style.display="block";
  const total = queue.length;
  const rate = Math.round(first/total*100);
  $("rate").textContent = rate + "%";
  $("rFirst").textContent = first; $("rHint").textContent = hinted; $("rWrong").textContent = wrong;
  const wrongSet = queue.filter(x => missed.has(x.id));
  $("wrongList").innerHTML = wrongSet.length
    ? wrongSet.map(x=>`<div class="wrongItem"><p><b>${x.t}</b></p><p class="small">${x.s}</p><p class="small">${x.tip}｜累计错 ${wrongBook[x.id]||0} 次</p></div>`).join("")
    : `<p class="small">本轮没有错题，状态不错。</p>`;
  history.push({date:new Date().toLocaleDateString("zh-CN"), total, first});
  localStorage.setItem(HKEY, JSON.stringify(history.slice(-20)));
  refreshHome();
}
$("againWrong").onclick = ()=>{
  const list = DATA.items.filter(x=>wrongBook[x.id]);
  if(!list.length) return alert("没有错题可练。");
  shuffle(list); startRound(list);
};
$("againAll").onclick = ()=> { startRound(buildQueue(selectedCat(), false)); };
$("home2").onclick = ()=>{ $("result").style.display="none"; $("home").style.display="block"; refreshHome(); };

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }
</script>
</body></html>
