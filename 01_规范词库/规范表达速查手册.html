<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>申论规范表达速查手册</title><style>
:root{--paper:#faf8f3;--ink:#1f1c18;--muted:#6b6459;--line:#e2dccf;--accent:#a4161a;--accent2:#1f4d3f;--card:#fff;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Songti SC","STSong","SimSun",serif;font-weight:600;letter-spacing:.5px}
a{color:var(--accent2)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 80px}
header.top{padding:48px 0 24px;border-bottom:1px solid var(--line);margin-bottom:22px}
header.top h1{margin:0 0 10px;font-size:32px}
header.top p{margin:0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.stat b{display:block;font-size:24px;color:var(--accent);font-family:"Songti SC",serif}
.stat span{font-size:12px;color:var(--muted)}
.toolbar{position:sticky;top:0;z-index:20;background:rgba(250,248,243,.94);backdrop-filter:blur(6px);padding:14px 0;border-bottom:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid rgba(164,22,26,.18);border-color:var(--accent)}
.btn{font:inherit;cursor:pointer;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--ink);color:#faf8f3;border-color:var(--ink)}
progress{width:100%;height:4px;border:0;background:#eae4d7}
progress::-webkit-progress-bar{background:#eae4d7}
progress::-webkit-progress-value{background:var(--accent)}
progress::-moz-progress-bar{background:var(--accent)}
.cat-head{margin:38px 0 12px}
.cat-head h2{font-size:22px;margin:0 0 6px}
.cat-head p{margin:0;color:var(--muted);font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.idx{font-family:"Songti SC",serif;color:var(--accent);font-weight:600}
.sent{margin:8px 0 10px;font-size:16px;font-family:"Songti SC","STSong",serif;line-height:1.9}
.ansRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.label{font-size:11px;letter-spacing:2px;color:var(--muted);border-left:3px solid var(--accent);padding-left:8px}
.ans{font-weight:700;font-size:17px;color:var(--accent2)}
.masked .ans{filter:blur(6px);cursor:pointer;user-select:none}
.masked .ans:hover{filter:blur(3px)}
.tip{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.master{margin-top:10px}
.done{opacity:.62}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:40px}
.overlay{position:fixed;inset:0;background:rgba(31,28,24,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 6px;font-size:18px;color:var(--accent)}
@media(max-width:640px){header.top h1{font-size:24px}.sent{font-size:15px}.wrap{padding:0 14px 60px}}
</style></head>
<body>
<div class="wrap">
<header class="top">
  <h1>申论规范表达速查手册</h1>
  <p>15 套国考真题语料 · 12 个主题 · 先遮答案自测，再点开核对。标记“已掌握”的词条会自动淡化。</p>
  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>词条总数</span></div>
    <div class="stat"><b id="sDone">0</b><span>已掌握</span></div>
    <div class="stat"><b id="sLeft">0</b><span>待掌握</span></div>
    <div class="stat"><b id="sShow">0</b><span>当前显示</span></div>
  </div>
</header>
<div class="toolbar">
  <div class="row">
    <input type="search" id="q" placeholder="搜资料句 / 规范表达 / 关键词，如：养老、空心化" style="flex:1;min-width:220px">
    <button class="btn primary" id="drill">随机抽背 10 条</button>
    <button class="btn" id="maskBtn">遮住答案：开</button>
    <button class="btn" id="onlyLeft">只看未掌握</button>
    <button class="btn" id="reset">清空掌握记录</button>
  </div>
  <div class="chips" id="chips"></div>
</div>
<progress id="bar" value="0" max="100"></progress>
<div id="list"></div>
<p class="foot">语料来源：2022—2026 国考申论真题（副省级 / 地市级 / 行政执法）＋《申论规范词总结》。</p>
</div>
<div class="overlay" id="ov"><div class="modal">
  <h3>随机抽背</h3>
  <p id="dCat" style="color:#6b6459;font-size:12px;margin:0 0 10px"></p>
  <p id="dSent" style="font-family:'Songti SC',serif;font-size:18px;line-height:1.9;margin:0 0 14px"></p>
  <p id="dAns" style="font-size:20px;font-weight:700;color:#1f4d3f;margin:0 0 8px;filter:blur(6px);cursor:pointer"></p>
  <p id="dTip" style="color:#6b6459;font-size:13px;margin:0 0 18px"></p>
  <div class="row"><button class="btn primary" id="dShow">显示答案</button><button class="btn" id="dNext">下一条</button><button class="btn" id="dClose">关闭</button></div>
</div></div>
<script>
const DATA = {"cats":[{"id":"gov","name":"政务服务与政府治理","intro":"概括政府“怎么做事”的词，常见于概括做法题、对策题。答题时优先用“动词+宾语”的四字结构。","usage":"高频句式：完善……机制、压实……责任、推动……下沉、实现……一体化、从“管理”转向“服务”。"},{"id":"city","name":"城市治理与公共服务","intro":"城市治理类材料专供，考查精细化、智慧化、人性化三条主线，以及“重地上轻地下”等典型问题。","usage":"问题侧：设施不完善、重面子轻里子；对策侧：分区分级、智慧监管、补齐短板、因地制宜。"},{"id":"ind","name":"产业转型与企业经营","intro":"常考“变与不变”“传统与现代”“规模与品质”的辩证关系，是2026副省级作文的原生语境。","usage":"分析句式：以……为主、……为辅；在……之间找准平衡点；既……又……，防止非此即彼。"},{"id":"rur","name":"乡村振兴与基层发展","intro":"空心化、撂荒、等靠要、头雁效应是四大高频词，作答多用“人、地、钱、业”四维展开。","usage":"对策句式：盘活……资源、推动……下沉、培育……带头人、拓宽……渠道。"},{"id":"liv","name":"民生保障（养老·医疗·教育）","intro":"“一老一小”是近年重点，养老看普惠可及与安全监管的平衡，教育看均衡与资源共享。","usage":"对策句式：发展普惠型……、推进医养结合、促进优质资源下沉、避免“一刀切”。"},{"id":"cul","name":"文化传承与文化产业","intro":"核心是“传承—转化—传播”三步：先护住根脉，再创造性转化，最后提升影响力。","usage":"对策句式：坚持修旧如旧、推动创造性转化创新性发展、打造文化新地标、讲好中国故事。"},{"id":"eco","name":"生态文明与绿色发展","intro":"“两山”理念贯穿，问题侧抓“重经济轻环境”，对策侧抓绿色低碳、循环经济、生态补偿。","usage":"对策句式：推动绿色化生产、建立生态补偿机制、发展循环经济、倡导绿色低碳生活方式。"},{"id":"sci","name":"科技创新与人才","intro":"高频矛盾是“引进与自主”“引才与用才”，要写出从“输血”到“造血”的转变。","usage":"对策句式：提升自主创新能力、破解“卡脖子”、柔性引才、以老带新、促进成果转化。"},{"id":"law","name":"法治建设与执法监管","intro":"执法类材料必背“严格规范公正文明执法”一整句，以及柔性执法、联合执法、精准监管。","usage":"对策句式：坚持严格规范公正文明执法、压实平台主体责任、提高违法成本、推进联合执法。"},{"id":"sty","name":"干部作风与基层减负","intro":"“不作为、慢作为、乱作为、不善为”是四胞胎，必须按材料的具体表现精确区分。","usage":"对策句式：整治形式主义、为基层减负、健全容错纠错机制、坚持严管和厚爱相结合。"},{"id":"soc","name":"社会心态与文明素养","intro":"多用于分析原因，抓心理动因：从众、逆反、面子、攀比、陌生人社会。","usage":"分析句式：折射出……心理；根源在于……；需加强引导，培育理性平和的社会心态。"},{"id":"econ","name":"经济消费与市场秩序","intro":"市场类材料抓“竞争秩序、供需结构、消费升级”三条线，注意区分现象与本质。","usage":"对策句式：维护公平竞争、优化营商环境、释放消费潜力、推动供需高水平动态平衡。"}],"items":[{"c":"gov","s":"市民在手机上就能办完社保、公积金等全部审批事项。","t":"掌上办／指尖办","tip":"载体是手机、App，关键词“不用跑”"},{"c":"gov","s":"过去办营业执照要跑五个部门、交三套材料，现在一个窗口一次办结。","t":"一站式服务／只跑一趟","tip":"一个窗口、一次办结"},{"c":"gov","s":"群众登录政务平台提交材料，全程网上审批，不用再到大厅。","t":"一网通办／全程网办","tip":"全流程线上，无需线下"},{"c":"gov","s":"政府部门成立了优化营商环境办公室，明确各科室职责分工。","t":"成立机构、完善组织架构","tip":"搭架子、定职责"},{"c":"gov","s":"以前等着群众上门办事，现在干部主动送政策、送服务上门。","t":"转变执政理念／主动服务群众","tip":"从“等上门”到“送上门”"},{"c":"gov","s":"社区承担民事调解、民政残联、劳动保障等几十项事务。","t":"工作职责广／职能繁杂","tip":"事务多、条线多"},{"c":"gov","s":"同一项工作，城管、公安、市场监管等多个部门一起处理、互相配合。","t":"多部门联动／联合执法","tip":"多主体、同处理"},{"c":"gov","s":"出了问题，谁来主管、谁来执行、各自管什么，都还不明确。","t":"权责不明／多头管理","tip":"没人负责、都能管"},{"c":"gov","s":"群众在网上留言反映问题，工作人员当天就回应并处理。","t":"及时回应／接诉即办","tip":"快回应、马上办"},{"c":"gov","s":"同一个事项，隔三岔五就有不同部门来检查，基层疲于应付。","t":"督查频繁／检查过多过频","tip":"频次高、多头查"},{"c":"gov","s":"这项政策不是一阵风，而是连续多年坚持推行。","t":"常态化／建立长效机制","tip":"长久坚持、非运动式"},{"c":"gov","s":"政府网站上查不到应当公开的财政资金使用情况。","t":"信息公开不到位／政务公开不足","tip":"该公开的没公开"},{"c":"gov","s":"县里把名目繁多的部门业务考核合并成一次全面考核。","t":"整合考核内容／简化考核项目","tip":"多考合一"},{"c":"gov","s":"考核时只看材料写得漂不漂亮，实际工作成效反而不问。","t":"考核重材料、轻实效","tip":"唯材料、不问效"},{"c":"gov","s":"群众办理业务不受固定上班时间限制，周末和晚上也能办。","t":"业务办理时间灵活／延时服务","tip":"错开上班时间"},{"c":"gov","s":"某项审批过去要层层上报，现在负责人可直接通知执法部门处置。","t":"精简层级／提高办事效率","tip":"减层级、提速度"},{"c":"city","s":"H市针对不同区域设定不同亮度，生态良好区域只保留功能性路灯。","t":"分区分级管控／精细化管理","tip":"按区域分类施策"},{"c":"city","s":"智慧照明系统实时显示配电箱状态、亮灯时间、能耗等数据。","t":"数字化管理／智慧化监管","tip":"数据上屏、实时监测"},{"c":"city","s":"路灯故障可精准定位，维修人员及时到位，人工巡查频率反而下降。","t":"提高管理效率／降低人力成本","tip":"效率升、人工降"},{"c":"city","s":"5G灯杆集安防监控、空气质量监测、报警、信息发布等功能于一体。","t":"设施多功能集成","tip":"一杆多用"},{"c":"city","s":"城市照明规划综合考虑自然地理、历史文化，呈现各区域独特气质。","t":"因地制宜／整体规划","tip":"结合本地禀赋"},{"c":"city","s":"居民区设置柔和灯光，避免对居民休息造成干扰。","t":"人性化设计／以人为本","tip":"照顾居民感受"},{"c":"city","s":"下一步聚焦老旧小区、背街小巷的路灯照明“暗盲区”开展整治。","t":"补齐民生短板／专项整治","tip":"补短板、治盲区"},{"c":"city","s":"灯光是亮一点还是暗一点，众口难调，居民诉求各不相同。","t":"诉求多元／众口难调","tip":"利益诉求分化"},{"c":"city","s":"不少城市大城小城一个样、城里城外一个样，缺乏辨识度。","t":"同质化／千城一面","tip":"特色缺失"},{"c":"city","s":"一些城市只重地上景观光鲜，忽视地下管网，最后地下一团糟。","t":"重地上、轻地下／重面子轻里子","tip":"重形象、轻内里"},{"c":"city","s":"公交站牌一种高2.6米、一种高3.48米，字又小，群众很难看清。","t":"设施设计不科学／不适老","tip":"设计不实用"},{"c":"city","s":"一下大雨，路面积水二三十厘米，排不出去。","t":"排水系统差／基础设施薄弱","tip":"管网欠账"},{"c":"city","s":"城市为外地人提供均等公共服务，让他们真正融入城市生活。","t":"城市包容性","tip":"让外来人口融入"},{"c":"city","s":"公园建了3公里绿道，沿途设中心驿站、休息座椅、避雨亭。","t":"完善公 const KEY = "shenlun_vocab_mastered_v1";
let mastered = JSON.parse(localStorage.getItem(KEY) || "{}");
let onlyLeft = false, mask = true, curCat = "all", kw = "";
const el = id => document.getElementById(id);
const catName = id => (DATA.cats.find(c=>c.id===id)||{}).name || id;

// 类别筛选按钮
const chips = [{id:"all",name:"全部"}].concat(DATA.cats.map(c=>({id:c.id,name:c.name})));
el("chips").innerHTML = chips.map(c=>`<button class="chip ${c.id==='all'?'on':''}" data-cat="${c.id}">${c.name}</button>`).join("");
el("chips").addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  curCat = b.dataset.cat;
  document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on", x===b));
  render();
});

function filtered(){
  return DATA.items.filter(x=>
    (curCat==="all"||x.c===curCat) &&
    (!onlyLeft || !mastered[x.c+"|"+x.s]) &&
    (!kw || (x.s+x.t+x.tip).toLowerCase().includes(kw))
  );
}

function render(){
  const list = filtered();
  let html = "", lastCat = null, n = 0;
  for(const x of list){
    if(x.c !== lastCat){
      const c = DATA.cats.find(c=>c.id===x.c);
      html += `<div class="cat-head"><h2>${c.name}</h2><p>${c.intro}</p><p style="margin-top:4px;color:#a4161a;font-size:12.5px">${c.usage}</p></div>`;
      lastCat = x.c; n = 0;
    }
    n++;
    const id = x.c+"|"+x.s;
    const done = !!mastered[id];
    html += `<article class="card ${mask?'masked':''} ${done?'done':''}" data-id="${id}">
      <div class="meta"><span class="idx">${String(n).padStart(2,'0')}</span><span>${done?'✔ 已掌握':''}</span></div>
      <p class="sent">${x.s}</p>
      <div class="ansRow"><span class="label">规范表达</span><span class="ans" data-ans title="点击显示答案">${x.t}</span></div>
      <p class="tip">提示：${x.tip}</p>
      <button class="btn master">${done?'✔ 已掌握（点击取消）':'标记为已掌握'}</button>
    </article>`;
  }
  el("list").innerHTML = html || `<p style="text-align:center;color:#6b6459;padding:60px 0">没有匹配的词条，换个关键词试试。</p>`;
  updateStats(list.length);
}

function updateStats(shown){
  const total = DATA.items.length;
  const done = DATA.items.filter(x=>mastered[x.c+"|"+x.s]).length;
  el("sTotal").textContent = total;
  el("sDone").textContent = done;
  el("sLeft").textContent = total - done;
  el("sShow").textContent = shown;
  el("bar").value = total ? Math.round(done/total*100) : 0;
}

el("list").addEventListener("click", e=>{
  const card = e.target.closest(".card"); if(!card) return;
  const id = card.dataset.id;
  if(e.target.dataset.ans !== undefined){
    if(mask) e.target.style.filter = "none";
    return;
  }
  if(e.target.classList.contains("master")){
    if(mastered[id]) delete mastered[id]; else mastered[id] = Date.now();
    localStorage.setItem(KEY, JSON.stringify(mastered));
    render();
  }
});

el("q").addEventListener("input", e=>{ kw = e.target.value.trim().toLowerCase(); render(); });
el("maskBtn").addEventListener("click", ()=>{
  mask = !mask;
  el("maskBtn").textContent = "遮住答案：" + (mask?"开":"关");
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("masked", mask));
  document.querySelectorAll("[data-ans]").forEach(a=>a.style.filter = "");
});
el("onlyLeft").addEventListener("click", ()=>{
  onlyLeft = !onlyLeft; el("onlyLeft").classList.toggle("on", onlyLeft); render();
});
el("reset").addEventListener("click", ()=>{
  if(confirm("确定清空所有“已掌握”记录吗？")){ mastered = {}; localStorage.removeItem(KEY); render(); }
});

// 随机抽背
let pool = [];
el("drill").addEventListener("click", ()=>{
  pool = DATA.items.filter(x=>!mastered[x.c+"|"+x.s]);
  if(!pool.length) pool = DATA.items.slice();
  shuffle(pool); drillIdx = 0; showDrill();
});
let drillIdx = 0;
function showDrill(){
  const x = pool[drillIdx % pool.length];
  el("dCat").textContent = catName(x.c) + " · 第 " + ((drillIdx%pool.length)+1) + " / " + pool.length;
  el("dSent").textContent = x.s;
  el("dAns").textContent = x.t;
  el("dAns").style.filter = "blur(6px)";
  el("dTip").textContent = "提示：" + x.tip;
  el("ov").classList.add("show");
}
el("dShow").onclick = ()=> el("dAns").style.filter = "none";
el("dNext").onclick = ()=>{ drillIdx++; showDrill(); };
el("dClose").onclick = ()=> el("ov").classList.remove("show");
