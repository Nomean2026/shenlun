<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>申论大作文框架训练</title>
<style>
:root{
  --ink:#1c2430; --sub:#5b6675; --line:#e4e8ee; --bg:#f6f7f9; --card:#ffffff;
  --main:#1f5f9e; --main-soft:#eaf2fa; --warn:#b45309; --ok:#0f766e; --bad:#b91c1c;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.75;font-size:15px}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
header{padding:6px 0 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
h1{font-size:24px;margin:0 0 8px;letter-spacing:.5px}
header p{margin:0;color:var(--sub);font-size:14px}
.layout{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.side h2{font-size:15px;margin:0 0 12px;color:var(--main)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;
  padding:4px 10px;font-size:12.5px;cursor:pointer}
.tab.active{background:var(--main);color:#fff;border-color:var(--main)}
.qlist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto}
.qitem{text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:8px 10px;cursor:pointer;font-size:13px;color:var(--ink);line-height:1.5}
.qitem:hover{border-color:#b9d3ea}
.qitem.active{background:var(--main-soft);border-color:var(--main)}
.qitem small{display:block;color:var(--sub);font-size:11.5px;margin-top:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button.primary{background:var(--main);color:#fff;border:none;border-radius:8px;padding:9px 14px;
  cursor:pointer;font-size:14px}
button.ghost{background:#fff;color:var(--main);border:1px solid var(--main);border-radius:8px;
  padding:9px 14px;cursor:pointer;font-size:14px}
button.gray{background:#fff;color:var(--sub);border:1px solid var(--line);border-radius:8px;
  padding:9px 14px;cursor:pointer;font-size:14px}
button:hover{filter:brightness(.97)}
.q-head{background:var(--main-soft);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.q-head .cat{display:inline-block;background:#fff;color:var(--main);border-radius:999px;
  font-size:12px;padding:2px 10px;margin-bottom:8px}
.q-head h3{margin:0 0 8px;font-size:17px;line-height:1.6}
.q-head p{margin:0;color:var(--sub);font-size:13.5px}
.field{margin-bottom:14px}
label{display:block;font-size:13.5px;color:var(--main);font-weight:600;margin-bottom:5px}
label span{font-weight:400;color:var(--sub);font-size:12px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;font-size:14px;font-family:inherit;line-height:1.7;background:#fff;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--main);box-shadow:0 0 0 3px #eaf2fa}
.counter{text-align:right;font-size:11.5px;color:var(--sub);margin-top:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.row{grid-template-columns:1fr}}
.ref{display:none;margin-top:20px}
.ref.show{display:block}
.ref-card{background:#fbfcfe;border:1px solid #d8e6f3;border-radius:12px;padding:16px;margin-bottom:14px}
.ref-card h4{margin:0 0 8px;font-size:15px;color:var(--main)}
.ref-card ol,.ref-card ul{margin:6px 0 0 18px;padding:0}
.ref-card li{margin-bottom:6px;font-size:13.8px}
.thesis{background:#fff;border-left:3px solid var(--main);padding:8px 12px;border-radius:6px;
  font-size:14px;margin:6px 0}
.pt{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.pt b{color:var(--ink)}
.pt p{margin:4px 0;font-size:13.6px;color:var(--sub)}
.pt p em{color:var(--ok);font-style:normal}
.pit{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px 12px;
  font-size:13.4px;color:#7c2d12;margin-top:10px}
.logic{margin-top:12px}
.logic h4{margin:0 0 8px;font-size:15px}
.logic .step{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.logic .num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--main);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px}
.logic .txt{font-size:13.6px;color:var(--sub)}
.logic .txt b{color:var(--ink)}
.checklist{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
.checklist h4{margin:0 0 8px;font-size:14px}
.checklist label{display:flex;gap:8px;align-items:flex-start;font-weight:400;color:var(--ink);
  font-size:13.5px;margin-bottom:6px;cursor:pointer}
.checklist input{width:16px;height:16px;margin-top:3px;flex:0 0 auto}
.score{font-size:13px;color:var(--sub);margin-top:6px}
.tip{font-size:12.5px;color:var(--sub);margin-top:10px;line-height:1.6}
footer{margin-top:26px;color:var(--sub);font-size:12.5px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>申论大作文 · 框架训练场</h1>
    <p>先写骨架，再看参考。每题只练“标题—中心论点—三个分论点—论据—结尾”，写完对照讲解，最后过一遍自检清单。</p>
  </header>

  <div class="layout">
    <aside class="panel side">
      <h2>题库（按类别筛选）</h2>
      <div class="tabs" id="tabs"></div>
      <div class="qlist" id="qlist"></div>
      <div class="btns">
        <button class="gray" id="randomBtn">随机抽一题</button>
        <button class="gray" id="clearBtn">清空本题草稿</button>
      </div>
      <div class="tip">草稿自动保存在本机浏览器，关闭页面也不会丢；换电脑不通用。</div>
    </aside>

    <main>
      <section class="panel" id="mainPanel">
        <div class="q-head">
          <span class="cat" id="catTag">—</span>
          <h3 id="qTitle">请选择左侧题目</h3>
          <p id="qPrompt"></p>
        </div>

        <div class="field">
          <label>① 标题 <span>（先写 3 个备选，挑最贴题的一个）</span></label>
          <input type="text" id="fTitle" placeholder="如：把服务做到群众心坎上">
        </div>

        <div class="field">
          <label>② 中心论点 <span>（一句话，必须含题眼关键词）</span></label>
          <textarea id="fThesis" rows="2" placeholder="我认为……关键在于……"></textarea>
          <div class="counter" id="cThesis">0 字</div>
        </div>

        <div class="field">
          <label>③ 分论点一 <span>（判断句，不要口号）</span></label>
          <textarea id="fP1h" rows="1" placeholder="段首句"></textarea>
          <textarea id="fP1e" rows="2" placeholder="支撑论据：用哪则材料？加一句分析（因果/对比/反面假设）"></textarea>
        </div>

        <div class="field">
          <label>④ 分论点二</label>
          <textarea id="fP2h" rows="1" placeholder="段首句"></textarea>
          <textarea id="fP2e" rows="2" placeholder="支撑论据 + 分析"></textarea>
        </div>

        <div class="field">
          <label>⑤ 分论点三</label>
          <textarea id="fP3h" rows="1" placeholder="段首句"></textarea>
          <textarea id="fP3e" rows="2" placeholder="支撑论据 + 分析"></textarea>
        </div>

        <div class="field">
          <label>⑥ 结尾 <span>（回扣标题 + 一个意象 + 一句判断）</span></label>
          <textarea id="fEnd" rows="2" placeholder="……"></textarea>
        </div>

        <div class="btns">
          <button class="primary" id="refBtn">对照参考框架</button>
          <button class="ghost" id="copyBtn">复制我的框架</button>
          <button class="gray" id="saveBtn">保存草稿</button>
        </div>

        <div class="checklist">
          <h4>交卷前自检（点击勾选）</h4>
          <label><input type="checkbox" data-ck="1"><span>标题里有题眼关键词，不是泛泛的“奋进”“新篇”。</span></label>
          <label><input type="checkbox" data-ck="2"><span>中心论点能回答题干的问题，不是把题干抄一遍。</span></label>
          <label><input type="checkbox" data-ck="3"><span>三个分论点在同一层级、互不包含、句式相近。</span></label>
          <label><input type="checkbox" data-ck="4"><span>每个分论点都有材料例证，且例证不超过两处、有分析。</span></label>
          <label><input type="checkbox" data-ck="5"><span>至少有一段写了“反面假设”或“边界提醒”。</span></label>
          <label><input type="checkbox" data-ck="6"><span>结尾回扣标题，没有喊新口号、没有引入新观点。</span></label>
          <div class="score" id="score">已完成 0 / 6</div>
        </div>

        <div class="ref" id="refBox"></div>
      </section>
      <footer>题库取自 2022—2026 国考申论 15 套真题的作文题与同类变式 · 仅供训练使用</footer>
    </main>
  </div>
</div>

<script>
const DATA = [
{
 id:"A1", cat:"基层治理", title:"为群众办好事、让群众感到好办事、把群众的事办好（2025 行政执法）",
 prompt:"请围绕“为群众办好事”“让群众感到好办事”“把群众的事办好”写一篇文章。要求：观点明确，见解深刻；参考给定资料，但不拘泥于给定资料；1000—1200 字。",
 hint:"材料可用：全天候医保窗口、税费驿站与 15 分钟办税圈、远程虚拟窗口、“办不成事”窗口、逸云路 32 盏灯三天亮起。",
 ref:{
  titles:["把服务做到群众心坎上","从“办好事”到“办好群众的事”","服务群众的三个“好”"],
  thesis:"三个“好”是递进关系：为群众办好事是立场，让群众感到好办事是方法，把群众的事办好是标准，三者统一于人民满意。",
  points:[
   {head:"为群众办好事，首在立场——把群众的事当自己的事。",why:"解决“想不想办”的问题。",ev:"全天候窗口：全局轮岗、党员带头双休日办公；不能现场办的先收资料、留电话、工作日办结。反面：只按朝九晚五，群众就得在工作和办事之间二选一。"},
   {head:"让群众感到好办事，重在方法——从群众视角重排流程。",why:"解决“顺不顺”的问题。",ev:"税费驿站进街道、一站式十几分钟办完；15 分钟办税圈与银行社区园区商超共建；远程虚拟窗口“数据多跑路”。"},
   {head:"把群众的事办好，成在标准——闭环、实效、可检验。",why:"解决“成不成”的问题。",ev:"逸云路路灯：项目未移交无法通电→“办不成事”窗口当天回访、督促责任单位、干部夜查、三天 32 盏全亮；雨霞区以此倒逼担当。"}
  ],
  ending:"一盏灯、一张证、一个窗口，对群众就是日子。有立场、有方法、有结果，才是完整的为民服务。",
  pitfalls:"把三个“好”写成同义反复；只写态度，不写机制和结果；三个分论点没有递进关系。",
  logic:[
   {t:"破题",d:"开头用三个材料场景对应三个“好”，一句话完成“场景—概念”的对接，不绕弯。"},
   {t:"分层",d:"三层按“想办—好办—办成”递进：立场解决动机，方法解决体验，标准解决结果。顺序不能颠倒。"},
   {t:"论证",d:"每段“判断句+材料例+反面假设+回扣”。反面假设是关键，它把“为什么必须这样”讲透。"},
   {t:"收束",d:"结尾用三个具象（灯、证、窗口）落地，再回到“三者统一”，不喊新口号。"}
  ]
 }
},
{
 id:"A2", cat:"基层治理", title:"由“无柜台、肩并肩”谈服务理念转变（2022 行政执法材料 2 变式）",
 prompt:"某县为民服务中心撤掉服务柜台，推行“无柜台、肩并肩”帮办服务。请结合给定资料，联系实际，自选角度，自拟题目，写一篇文章。1000—1200 字。",
 hint:"材料可用：咨询导办台+电脑桌、帮办员并排坐、群众全程可见；“铁路警察各管一段”；全科受理培训；“这里办”App 取号、云证通扫码无感智办；老冯说“有人有心理落差”。",
 ref:{
  titles:["撤掉心中的柜台","从“我管你”到“我帮你”","让服务近一点，再近一点"],
  thesis:"撤掉柜台只是形式，真正的改革是撤掉“心中的柜台”——把管理者的角色惯性换成服务者的平等姿态，并用能力与体制支撑它。",
  points:[
   {head:"撤掉“眼中的柜台”，先让空间平等起来。",why:"形式变化带来心理变化。",ev:"咨询导办台迎上前、帮办员并排坐、全程可见操作；王女士“距离拉近”，小丁“交流顺畅”。"},
   {head:"撤掉“心中的柜台”，要让观念真正转过来。",why:"习惯最难改。",ev:"有人有心理落差甚至抱怨；培训先行：高频事项答疑、材料审核、系统录入，做到“进一门、取一号、找一人、办成事”。"},
   {head:"撤掉“心中的柜台”，还要拆掉部门之间的“墙”。",why:"无柜台=无差别全科受理。",ev:"“铁路警察各管一段”导致茫然失措；数字化补位（App 取号、扫码无感智办）+ 行政管理体制改革同步。"}
  ],
  ending:"柜台是物理的，隔阂是心理的。桌子搬走容易，心里的柜台拆掉很难；只要把群众放在心里，难事也能一件件做成。",
  pitfalls:"只写“态度要好”；把“撤柜台”当成目的；忽略能力不足与部门壁垒这两个真问题。",
  logic:[
   {t:"辨义",d:"先分清“眼中的柜台”（物理窗口）与“心中的柜台”（观念、部门壁垒、能力短板），全文才有骨架。"},
   {t:"递进",d:"空间→观念→体制，由表及里。第三层必须写，否则文章停在“微笑服务”。"},
   {t:"防偏",d:"补一段“撤柜台不是目的”：自助机不会用、老人不方便，说明形式可减、服务不能减。"},
   {t:"收束",d:"用“物理/心理”对照收尾，扣题最紧。"}
  ]
 }
},
{
 id:"B1", cat:"经济产业", title:"小配件如何成为“市场中的主角”（2024 地市/执法）",
 prompt:"隆金公司做的是汽车门把手，却成为行业领航者。请结合给定资料，联系实际，自选角度，自拟题目，写一篇文章。1000—1200 字。",
 hint:"材料可用：1986 年起做门把手；质量改进团队；数字化车间效率+28%、成本-12%；295 项专利、95% 国产替代；市长质量奖、省名牌、主导行业标准、单项冠军；全国每 3 辆乘用车 1 辆在用。",
 ref:{
  titles:["做配件，也能当主角","以“专”立身，以“新”致远","把简单的事做到不简单"],
  thesis:"小配件成为大主角，靠的是专注细分、严控质量、持续创新、以标准树品牌四者合力——把一件事做深，就是最宽的赛道。",
  points:[
   {head:"专注，是把简单的事做到不简单。",why:"细分领域做到极致，本身就有不可替代性。",ev:"30 多年只做门把手，“定位于能做得更好的事”；对比追风口、铺摊子的企业。"},
   {head:"质量，是企业的生命线。",why:"门把手关系车门能否关严、能否打开，关系生命安全。",ev:"市场定位—设计研发—调试生产—质量审核全程序；质量改进团队收集问题、实施改进。"},
   {head:"创新，是向上的梯子。",why:"没有研发，只能在低端代工。",ev:"每年数千万建数字化车间；企业研究院、博士后站、海外研发中心、200 多名人才；300 多项研发、295 项专利、95% 国产替代。"},
   {head:"标准与品牌，是行业话语权。",why:"从“被选择”到“被需要”。",ev:"市长质量奖（2 亿→8 亿）、省名牌、主导行业标准、国家制造业单项冠军；N 市企业培育库与产业集群政策。"}
  ],
  ending:"不挑赛道大小，只看做得够不够深；不争一时快慢，只看根基扎得够不够稳。",
  pitfalls:"只写“创新”，漏掉专注与质量；数据堆砌不作分析；把“单项冠军”当成口号。",
  logic:[
   {t:"设问",d:"开头用“一只门把手能有多大的名堂”设问，再用“全国每 3 辆就有 1 辆”回答，短而有劲。"},
   {t:"加码",d:"四层不是平铺：专注让企业活下来，质量让客户敢用，创新让企业向上，标准让企业有话语权。"},
   {t:"数据",d:"每段最多两个数字，且数字后面必须跟一句“这说明……”，否则就是罗列。"},
   {t:"收束",d:"用两组对仗收尾，短句有力量。"}
  ]
 }
},
{
 id:"B2", cat:"经济产业", title:"资源型城市如何转型（2023 副省 M 市材料变式）",
 prompt:"“以煤起家”的 M 市，通过延长产业链发展功能性新材料，实现动能转换。请结合给定资料，联系实际，自选角度，自拟题目，写一篇文章。1000—1200 字。",
 hint:"材料可用：煤→气化→合成气→甲醇→聚四氢呋喃→功能性新材料；腾夕材料考察 6 地后被诚意打动；项目书连夜研究次日送达；主要领导牵头领导小组、政企联合办公。",
 ref:{
  titles:["从一块煤到一条链","把比较优势变成竞争优势","转型，不是推倒重来"],
  thesis:"资源型城市转型，不能抛开家底另起炉灶，而要立足优势延长链条、精准招商补上关键环、以诚意和机制留住企业，并照顾好转岗的人。",

const CATS = ["全部","基层治理","经济产业","文化传承","生态文明","科技人才","乡村振兴","青年成长"];
let cur = null;
let curCat = "全部";

const $ = id => document.getElementById(id);
const storeKey = id => "essay_frame_" + id;

function renderTabs(){
  $("tabs").innerHTML = CATS.map(c =>
    `<button class="tab ${c===curCat?'active':''}" data-cat="${c}">${c}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>{
    b.onclick = ()=>{ curCat = b.dataset.cat; renderTabs(); renderList(); };
  });
}
function filtered(){ return curCat==="全部" ? DATA : DATA.filter(d=>d.cat===curCat); }
function renderList(){
  const list = filtered();
  $("qlist").innerHTML = list.map(d=>
    `<button class="qitem ${cur&&cur.id===d.id?'active':''}" data-id="${d.id}">
      ${d.title}<small>${d.cat}</small></button>`).join("");
  $("qlist").querySelectorAll(".qitem").forEach(b=>{
    b.onclick = ()=>select(b.dataset.id);
  });
}
function select(id){
  cur = DATA.find(d=>d.id===id);
  renderList();
  $("catTag").textContent = cur.cat;
  $("qTitle").textContent = cur.title;
  $("qPrompt").textContent = cur.prompt;
  const s = JSON.parse(localStorage.getItem(storeKey(id)) || "{}");
  $("fTitle").value = s.title || "";
  $("fThesis").value = s.thesis || "";
  $("fP1h").value = s.p1h || ""; $("fP1e").value = s.p1e || "";
  $("fP2h").value = s.p2h || ""; $("fP2e").value = s.p2e || "";
  $("fP3h").value = s.p3h || ""; $("fP3e").value = s.p3e || "";
  $("fEnd").value = s.end || "";
  updateCounter();
  loadCk();
  $("refBox").classList.remove("show");
  $("refBox").innerHTML = "";
}
function updateCounter(){ $("cThesis").textContent = ($("fThesis").value.trim().length) + " 字"; }

function renderRef(){
  if(!cur) return;
  const r = cur.ref;
  const pts = r.points.map((p,i)=>`
    <div class="pt">
      <b>分论点${i+1}：</b>${p.head}<br>
      <p><em>作用：</em>${p.why}</p>
      <p><em>可用论据：</em>${p.ev}</p>
    </div>`).join("");
  const logic = r.logic.map((l,i)=>`
    <div class="step"><div class="num">${i+1}</div>
      <div class="txt"><b>${l.t}：</b>${l.d}</div></div>`).join("");
  $("refBox").innerHTML = `
    <div class="ref-card">
      <h4>参考框架</h4>
      <p style="margin:4px 0 6px;color:#5b6675;font-size:13px">标题备选</p>
      <ul>${r.titles.map(t=>`<li>${t}</li>`).join("")}</ul>
      <p style="margin:10px 0 4px;color:#5b6675;font-size:13px">中心论点</p>
      <div class="thesis">${r.thesis}</div>
      ${pts}
      <div class="pt"><b>结尾：</b>${r.ending}</div>
      <div class="pit"><b>本题易丢分：</b>${r.pitfalls}</div>
    </div>
    <div class="ref-card logic">
      <h4>逐段逻辑讲解</h4>
      ${logic}
      <div class="tip">看完讲解，回到你自己的框架逐条比对：分论点是否同层级？每段有没有“为什么”？材料例是否超过两处？</div>
    </div>`;
  $("refBox").classList.add("show");
}
function collect(){
  if(!cur) return null;
  return {
    title:$("fTitle").value.trim(), thesis:$("fThesis").value.trim(),
    p1h:$("fP1h").value.trim(), p1e:$("fP1e").value.trim(),
    p2h:$("fP2h").value.trim(), p2e:$("fP2e").value.trim(),
    p3h:$("fP3h").value.trim(), p3e:$("fP3e").value.trim(),
    end:$("fEnd").value.trim()
  };
}
function save(){
  if(!cur) return;
  localStorage.setItem(storeKey(cur.id), JSON.stringify(collect()));
  $("saveBtn").textContent = "已保存 ✓";
  setTimeout(()=>$("saveBtn").textContent="保存草稿",1200);
}
function toText(){
  const c = collect();
  return `【题目】${cur.title}\n\n【标题】${c.title}\n【中心论点】${c.thesis}\n\n【分论点一】${c.p1h}\n论据：${c.p1e}\n\n【分论点二】${c.p2h}\n论据：${c.p2e}\n\n【分论点三】${c.p3h}\n论据：${c.p3e}\n\n【结尾】${c.end}`;
}

$("refBtn").onclick = ()=>{ if(!cur){alert("请先选择题库中的一道题");return;} save(); renderRef();
  $("refBox").scrollIntoView({behavior:"smooth",block:"start"}); };
$("saveBtn").onclick = save;
$("copyBtn").onclick = async ()=>{
  if(!cur){alert("请先选择题目");return;}
  const txt = toText();
  try{ await navigator.clipboard.writeText(txt); $("copyBtn").textContent="已复制 ✓"; }
  catch(e){ alert("复制失败，请手动选择文本"); }
  setTimeout(()=>$("copyBtn").textContent="复制我的框架",1400);
};
$("clearBtn").onclick = ()=>{
  if(!cur) return;
  if(!confirm("清空本题草稿？")) return;
  localStorage.removeItem(storeKey(cur.id));
  select(cur.id);
};
$("randomBtn").onclick = ()=>{
  const list = filtered();
  const d = list[Math.floor(Math.random()*list.length)];
  select(d.id);
};
$("fThesis").addEventListener("input", updateCounter);

const cks = document.querySelectorAll("[data-ck]");
function loadCk(){
  const k = "essay_ck_" + (cur ? cur.id : "none");
  const saved = JSON.parse(localStorage.getItem(k) || "[]");
  cks.forEach((c,i)=>{ c.checked = !!saved[i]; });
  refreshScore();
}
function refreshScore(){
  const n = [...cks].filter(c=>c.checked).length;
  $("score").textContent = `已完成 ${n} / ${cks.length}` + (n===cks.length ? " · 可以动笔了" : " · 还差 " + (cks.length-n) + " 项");
  localStorage.setItem("essay_ck_"+ (cur?cur.id:"none"), JSON.stringify([...cks].map(c=>c.checked)));
}
cks.forEach(c=>c.addEventListener("change", refreshScore));

renderTabs(); renderList();
select(DATA[0].id);
</script>
